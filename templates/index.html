<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Scanner</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Main Container */
        .container {
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            padding: 20px;
        }

        /* Header */
        h1 {
            text-align: center;
            color: #0078d7;
        }

        /* Input Fields and Button */
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            border-color: #0078d7;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 120, 215, 0.3);
        }

        button {
            background-color: #0078d7;
            color: white;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #005bb5;
        }

        /* Results Section */
        #results {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
        }

        #results p {
            margin: 0;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        footer a {
            color: #0078d7;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Port Scanner</h1>
        <form id="scannerForm">
            <input type="text" id="ip" placeholder="Enter Target IP (e.g., 127.0.0.1)" required />
            <input type="number" id="start_port" placeholder="Enter Start Port (e.g., 8080)" required />
            <input type="number" id="end_port" placeholder="Enter End Port (e.g., 10000)" required />
            <button type="submit">Start Scan</button>
        </form>
        <div id="results"></div>
        <footer>
            Built with ❤️ by <a href="#">GROUP 7</a>
        </footer>
    </div>

    <script>
        document.getElementById('scannerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ip = document.getElementById('ip').value;
            const start_port = document.getElementById('start_port').value;
            const end_port = document.getElementById('end_port').value;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<p style="color: #0078d7;">Scanning...</p>`;

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip, start_port, end_port })
                });

                const result = await response.json();

                if (result.error) {
                    resultsDiv.innerHTML = `<p style="color: red;">Error: ${result.error}</p>`;
                } else {
                    resultsDiv.innerHTML = `<pre>${result.output}</pre>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color: red;">Failed to fetch results. Please try again later.</p>`;
            }
        });
    </script>
</body>
</html>
